<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable version: the same mark as icon.svg, kept inside the central 80% circle, on a dark
       ground so Android can crop it to a circle or squircle without cutting the mark. -->
